// Top-level build file where you can add configuration options common to all sub-projects/modules.

apply from: "variables.gradle"

def agpVersion = findProperty('agpVersion') ?: '9.4.1'

buildscript {
  // Versions must be declared here — buildscript{} is evaluated before apply from: "variables.gradle"
  ext.kotlin_version = '2.3.20'
  ext.ksp_version = '2.3.6'
  repositories {
        google()
        mavenCentral()
    }
    dependencies {
      classpath 'com.google.gms:google-services:4.4.4'
      classpath "com.android.tools.build:gradle:${agpVersion}"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
      classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
      classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
      classpath "io.github.takahirom.roborazzi:roborazzi-gradle-plugin:1.77.0"
      classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"

      // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 9.0.0-beta.0 split Cordova support out of :capacitor-android into its own module,
// and the new module lost a dependency in the move. Its sources import AppCompatActivity, and
// its build file even defines `androidxAppCompatVersion` - but never adds AppCompat to its
// dependencies. In 8 the same code sat inside :capacitor-android, which had it. The build fails:
//
//   MockCordovaInterfaceImpl.java:4: error: package androidx.appcompat.app does not exist
//
// That build file is under node_modules/ and not ours to edit, so the dependency is supplied
// from here instead, using the same AppCompat version the rest of the app is forced to.
//
// Remove when a Capacitor 9 release adds the dependency itself - check by deleting this block
// and running :app:assembleDebug.
subprojects {
    if (name == 'capacitor-cordova-android') {
        afterEvaluate {
            dependencies {
                implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
            }
        }
    }
}

// The Kotlin compiler at its strictest, for the modules that are ours. Capacitor and its plugins
// are subprojects too, compiled from node_modules, and their warnings are not ours to fix.
//
// - allWarningsAsErrors: a warning nobody has to act on is a warning nobody reads. Every one
//   the compiler raises here is either a real smell (a safe call on something that cannot be
//   null means the types and the author disagree) or a deprecation that will become an error.
// - -Wextra: the compiler's additional checkers, off by default - redundant calls, unused
//   variables and values, conditions that can never change.
['app', 'wear', 'wear-sync'].each { name ->
    project(":$name") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach {
            compilerOptions {
                allWarningsAsErrors = true
                freeCompilerArgs.add('-Wextra')
            }
        }
    }
}

// Android lint at its strictest, for both apps: every check on, including the ones Google ships
// switched off, and any finding fails the build. There is no baseline - a finding is fixed, or
// suppressed in place with the reason next to it (@SuppressLint / tools:ignore).
//
// It used to report and never fail (abortOnError false), and only for the phone. Turned on, it
// found a widget drawing icons private to a beta library, a WorkManager API the watch was not
// allowed to call, and a Context held statically.
//
// Off:
// - The checks that compare our versions with whatever was published most recently. They would
//   fail a build that has not changed, on the day a library ships, and Dependabot already raises
//   those as pull requests.
// - LogConditional: wants every Log call behind BuildConfig.DEBUG. Release builds log on
//   purpose - a logcat from a user's phone or watch is how most bugs here get diagnosed.
// - SyntheticAccessor: a Java-era cost of private access from inner classes. R8 removes the
//   accessors, and the "fix" is widening visibility.
['app', 'wear'].each { name ->
    project(":$name") {
        pluginManager.withPlugin('com.android.application') {
            android.lint {
                checkAllWarnings = true
                warningsAsErrors = true
                abortOnError = true
                checkDependencies = false
                disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion',
                        'LogConditional', 'SyntheticAccessor'
            }
        }
    }
}

tasks.register('clean', Delete) {
  delete rootProject.layout.buildDirectory
}

